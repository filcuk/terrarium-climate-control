<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">AM2302 / DHT22 wiring (ESP32-C3)</text>

  <rect x="40" y="70" width="160" height="240" rx="12" fill="#1f3b5c"/>
  <text x="120" y="185" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">ESP32-C3</text>
  <g fill="#f2c94c" stroke="#333" stroke-width="1.5">
    <circle cx="200" cy="120" r="6"/>
    <circle cx="200" cy="190" r="6"/>
    <circle cx="200" cy="260" r="6"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#fff" text-anchor="end">
    <text x="188" y="125">3V3</text>
    <text x="188" y="195">GPIO6</text>
    <text x="188" y="265">GND</text>
  </g>

  <rect x="480" y="90" width="180" height="200" rx="14" fill="#e8f4ea" stroke="#2d6a4f" stroke-width="3"/>
  <text x="570" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#2d6a4f">AM2302</text>
  <text x="570" y="152" text-anchor="middle" font-size="13" fill="#2d6a4f">temp + humidity</text>
  <g fill="#fff" stroke="#333" stroke-width="1.5">
    <circle cx="480" cy="190" r="6"/>
    <circle cx="480" cy="230" r="6"/>
    <circle cx="480" cy="270" r="6"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#1b4332">
    <text x="496" y="195">VCC</text>
    <text x="496" y="235">DATA</text>
    <text x="496" y="275">GND</text>
  </g>

  <line x1="206" y1="120" x2="474" y2="190" stroke="#d62828" stroke-width="4"/>
  <line x1="206" y1="190" x2="474" y2="230" stroke="#f08c00" stroke-width="4"/>
  <line x1="206" y1="260" x2="474" y2="270" stroke="#111" stroke-width="4"/>

  <text x="340" y="145" text-anchor="middle" font-size="13" fill="#d62828">3V3 power</text>
  <text x="340" y="210" text-anchor="middle" font-size="13" fill="#b35c00">data</text>
  <text x="340" y="285" text-anchor="middle" font-size="13" fill="#111">ground</text>

  <text x="360" y="340" text-anchor="middle" font-size="13" fill="#444">Bare 4-pin sensors also need a 4.7&#8211;10 k&#937; pull-up from DATA to 3V3</text>
</svg>
